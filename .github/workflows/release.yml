name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: bun run build
        working-directory: packages/squid-chat

      - name: Build UI bundle
        run: bash scripts/build-ui-bundle.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/squid-chat-ui-*.tar.gz
            dist/squid-chat-ui-*.tar.gz.sha256
          generate_release_notes: true

      - name: Publish to npm
        working-directory: packages/squid-chat
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
